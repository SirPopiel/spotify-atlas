name: Tests & GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests
        run: npm test
      - name: Build isolated static site
        run: npm run build
      - name: Verify dist does not contain history exports
        run: |
          if find dist -type f | grep -E -i '(streaming.history|endsong|spotify.*history|\.zip$|\.csv$)' ; then
            echo 'Unexpected personal-history-looking file in site'; exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
